name: Build and Release Tweak

permissions:
    contents: read

on:
    push:
        branches: [dev]
    workflow_dispatch:
    release:
        types: [published]

jobs:
    build:
        runs-on: macos-15
        strategy:
            matrix:
                scheme: [rootful, rootless, roothide]
                include:
                  - scheme: rootful
                    scheme_arg: ""
                  - scheme: rootless
                    scheme_arg: "THEOS_PACKAGE_SCHEME=rootless"
                  - scheme: roothide
                    scheme_arg: "THEOS_PACKAGE_SCHEME=roothide"
        steps:
            - uses: actions/checkout@v7
              with:
                ref: ${{ github.event_name == 'release' && github.event.release.target_commitish || github.ref }}

            - name: Test scheduling delays
              shell: bash
              run: |
                swiftc Sources/tgapi/AutomaticScheduleTiming.swift scripts/test-schedule-timing.swift -o "$RUNNER_TEMP/tgextra-timing-tests"
                "$RUNNER_TEMP/tgextra-timing-tests"

            - name: Test advertisement detection
              shell: bash
              run: |
                swiftc Sources/tgapi/AdvertisementFilter.swift scripts/test-ad-filter.swift -o "$RUNNER_TEMP/tgextra-ad-tests"
                "$RUNNER_TEMP/tgextra-ad-tests"

            - name: Test story decoration detection
              shell: bash
              run: |
                swiftc Sources/tgapi/StoryVisibility.swift scripts/test-story-visibility.swift -o "$RUNNER_TEMP/tgextra-story-tests"
                "$RUNNER_TEMP/tgextra-story-tests"

            - name: Set up Theos
              uses: waruhachi/theos-action@v2.4.6
              with:
                theos-src: 'waruhachi/theos'
                theos-branch: 'main'
                sdks-src: 'waruhachi/sdks'
                sdks-branch: 'main'

            - name: Build Package
              shell: bash
              run: |
                make clean package FINALPACKAGE=1 STRIP=0 ${{ matrix.scheme_arg }}

            - name: Upload DEB
              uses: actions/upload-artifact@v7
              with:
                name: ${{ matrix.scheme }}-package
                path: packages/*.deb

    release:
        if: github.event_name == 'release' && github.event.release.target_commitish == github.event.repository.default_branch
        needs: build
        runs-on: macos-15
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v7
              with:
                ref: ${{ github.event.release.target_commitish }}

            - name: Clean up existing rolling release
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                gh release delete release --yes || true
                git push origin :refs/tags/release || true

            - name: Download all DEBs
              uses: actions/download-artifact@v8
              with:
                path: packages
                merge-multiple: true

            - name: Generate Checksums
              id: metadata
              shell: bash
              run: |
                for pkg in packages/*_iphoneos-arm.deb; do
                  if [ -f "$pkg" ]; then
                    echo "### Rootful (iphoneos-arm)" >> release_body.md
                    echo "* MD5: $(md5 -q $pkg)" >> release_body.md
                    echo "* SHA1: $(shasum -a 1 $pkg | awk '{ print $1 }')" >> release_body.md
                    echo "* SHA256: $(shasum -a 256 $pkg | awk '{ print $1 }')" >> release_body.md
                    echo "" >> release_body.md
                    break
                  fi
                done

                for pkg in packages/*_iphoneos-arm64.deb; do
                  if [ -f "$pkg" ]; then
                    echo "### Rootless (iphoneos-arm64)" >> release_body.md
                    echo "* MD5: $(md5 -q $pkg)" >> release_body.md
                    echo "* SHA1: $(shasum -a 1 $pkg | awk '{ print $1 }')" >> release_body.md
                    echo "* SHA256: $(shasum -a 256 $pkg | awk '{ print $1 }')" >> release_body.md
                    echo "" >> release_body.md
                    break
                  fi
                done

                for pkg in packages/*_iphoneos-arm64e.deb; do
                  if [ -f "$pkg" ]; then
                    echo "### RootHide (iphoneos-arm64e)" >> release_body.md
                    echo "* MD5: $(md5 -q $pkg)" >> release_body.md
                    echo "* SHA1: $(shasum -a 1 $pkg | awk '{ print $1 }')" >> release_body.md
                    echo "* SHA256: $(shasum -a 256 $pkg | awk '{ print $1 }')" >> release_body.md
                    echo "" >> release_body.md
                    break
                  fi
                done

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v3
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                tag_name: release
                name: TGExtra FE
                body_path: release_body.md
                files: packages/*.deb
                draft: false
                prerelease: false
                make_latest: true

            - name: Delete build artifacts
              uses: geekyeggo/delete-artifact@v6
              with:
                name: |
                  rootful-package
                  rootless-package
                  roothide-package
                failOnError: false
