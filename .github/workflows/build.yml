name: Build and Release Tweak

permissions:
    contents: read

on:
    push:
        branches: [dev]
    workflow_dispatch:
    release:
        types: [published]

jobs:
    build:
        runs-on: macos-15
        strategy:
            matrix:
                scheme: [rootful, rootless, roothide]
                include:
                  - scheme: rootful
                    scheme_arg: ""
                  - scheme: rootless
                    scheme_arg: "THEOS_PACKAGE_SCHEME=rootless"
                  - scheme: roothide
                    scheme_arg: "THEOS_PACKAGE_SCHEME=roothide"
        steps:
            - uses: actions/checkout@v7
              with:
                ref: ${{ github.event_name == 'release' && github.event.release.target_commitish || github.ref }}

            - name: Test scheduling delays
              shell: bash
              run: |
                swiftc Sources/tgapi/AutomaticScheduleTiming.swift scripts/test-schedule-timing.swift -o "$RUNNER_TEMP/tgextra-timing-tests"
                "$RUNNER_TEMP/tgextra-timing-tests"

            - name: Test advertisement detection
              shell: bash
              run: |
                swiftc Sources/tgapi/AdvertisementFilter.swift scripts/test-ad-filter.swift -o "$RUNNER_TEMP/tgextra-ad-tests"
                "$RUNNER_TEMP/tgextra-ad-tests"

            - name: Test story decoration detection
              shell: bash
              run: |
                swiftc Sources/tgapi/StoryVisibility.swift scripts/test-story-visibility.swift -o "$RUNNER_TEMP/tgextra-story-tests"
                "$RUNNER_TEMP/tgextra-story-tests"

            - name: Test retained-message identity and decoder symbol
              shell: bash
              run: |
                swiftc Sources/tgapi/RetainedMessageIdentity.swift Sources/tgapi/RetainedMessageIndex.swift scripts/test-retained-message-identity.swift -o "$RUNNER_TEMP/tgextra-retained-tests"
                "$RUNNER_TEMP/tgextra-retained-tests"
                swiftc -module-name Postbox -emit-library scripts/retained-decoder-symbol-fixture.swift -o "$RUNNER_TEMP/retained-decoder-fixture.dylib"
                nm -g "$RUNNER_TEMP/retained-decoder-fixture.dylib" | grep -F '$s7Postbox9MessageIdV19decodeArrayFromDataySayACG10Foundation0G0VFZ'

            - name: Test retained archive grouping
              shell: bash
              run: |
                swiftc Sources/tgapi/RetainedMessageIdentity.swift Sources/tgapi/RetainedMessageArchive.swift scripts/test-retained-archive.swift -o "$RUNNER_TEMP/tgextra-archive-tests"
                "$RUNNER_TEMP/tgextra-archive-tests"

            - name: Test SwiftSignalKit disposable ABI
              shell: bash
              run: |
                fixture="$RUNNER_TEMP/tgextra-disposable-abi"
                mkdir -p "$fixture/native" "$fixture/stub"
                swiftc -module-name SwiftSignalKit -emit-library -emit-module scripts/disposable-abi-fixture.swift -emit-module-path "$fixture/native/SwiftSignalKit.swiftmodule" -o "$fixture/native/libSwiftSignalKit.dylib"
                target="$(uname -m)-apple-macosx14.0"
                sed "s/arm64-apple-ios14.0/$target/g" Sources/SwiftStubs/SwiftSignalKit.swiftmodule/arm64-apple-ios.swiftinterface > "$fixture/stub/SwiftSignalKit.swiftinterface"
                swiftc -parse-as-library -I "$fixture/stub" scripts/test-disposable-abi.swift -L "$fixture/native" -lSwiftSignalKit -Xlinker -rpath -Xlinker "$fixture/native" -o "$fixture/test"
                "$fixture/test"

            - name: Test account avatar identity and fallback
              shell: bash
              run: |
                swiftc Sources/tgapi/AccountAvatarPolicy.swift scripts/test-account-avatar.swift -o "$RUNNER_TEMP/tgextra-avatar-tests"
                "$RUNNER_TEMP/tgextra-avatar-tests"

            - name: Test native avatar batch ABI
              shell: bash
              run: |
                fixture="$RUNNER_TEMP/tgextra-avatar-abi"
                mkdir -p "$fixture/native" "$fixture/stub"
                swiftc -module-name SwiftSignalKit -emit-library -emit-module scripts/avatar-signal-abi-fixture.swift -emit-module-path "$fixture/native/SwiftSignalKit.swiftmodule" -o "$fixture/native/libSwiftSignalKit.dylib"
                swiftc -module-name Postbox -enable-library-evolution -emit-library -emit-module -I "$fixture/native" -L "$fixture/native" -lSwiftSignalKit scripts/avatar-postbox-abi-fixture.swift -emit-module-path "$fixture/native/Postbox.swiftmodule" -o "$fixture/native/libPostbox.dylib"
                target="$(uname -m)-apple-macosx14.0"
                for module in SwiftSignalKit Postbox; do
                  sed "s/arm64-apple-ios14.0/$target/g" "Sources/SwiftStubs/$module.swiftmodule/arm64-apple-ios.swiftinterface" > "$fixture/stub/$module.swiftinterface"
                done
                swiftc -parse-as-library -I "$fixture/stub" Sources/tgapi/NativePeerLookup.swift Sources/tgapi/AccountAvatarPolicy.swift Sources/tgapi/RetainedMessageIdentity.swift Sources/tgapi/RetainedMessageArchive.swift scripts/test-avatar-batch-abi.swift -L "$fixture/native" -lPostbox -lSwiftSignalKit -Xlinker -rpath -Xlinker "$fixture/native" -o "$fixture/test"
                "$fixture/test"

            - name: Test manual chat and topic read scopes
              shell: bash
              run: |
                swiftc Sources/tgapi/AccountAvatarPolicy.swift Sources/tgapi/ManualReadPolicy.swift Sources/tgapi/ManualReadNavigation.swift scripts/test-manual-read.swift -o "$RUNNER_TEMP/tgextra-manual-read-tests"
                "$RUNNER_TEMP/tgextra-manual-read-tests"
                plutil -lint TGExtra.bundle/en.lproj/Localizable.strings TGExtra.bundle/it.lproj/Localizable.strings

            - name: Fetch Theos
              uses: actions/checkout@v7
              with:
                repository: waruhachi/theos
                ref: main
                submodules: recursive
                path: theos

            - name: Fetch patched SDKs
              uses: actions/checkout@v7
              with:
                repository: waruhachi/sdks
                ref: main
                submodules: recursive
                path: theos/sdks

            - name: Configure Theos
              shell: bash
              run: |
                brew install make ldid
                echo "THEOS=$GITHUB_WORKSPACE/theos" >> "$GITHUB_ENV"
                echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

            - name: Check generated manual-read navigation hooks
              shell: bash
              run: |
                perl "$THEOS/vendor/logos/bin/logos.pl" -c generator=internal Sources/tgapi/UI/ManualReadHooks.xm > "$RUNNER_TEMP/tgextra-manual-read-hooks.mm"
                xcrun --sdk iphoneos clang++ -fobjc-arc -fsyntax-only -arch arm64 -mios-version-min=14.0 -x objective-c++ -I Sources/tgapi/UI -I Sources/tgapiC/include "$RUNNER_TEMP/tgextra-manual-read-hooks.mm"

            - name: Build Package
              shell: bash
              run: |
                make clean package FINALPACKAGE=1 STRIP=0 ${{ matrix.scheme_arg }}

            - name: Verify internal tweak symbols
              shell: bash
              run: |
                test -n "$(find .theos/obj -type f -name TGExtra.dylib -print -quit)"
                while IFS= read -r library; do
                  if nm -u "$library" | grep -E '(_TGExtra|__Z.*TGExtra)'; then
                    echo "Unresolved internal TGExtra symbol in $library"
                    exit 1
                  fi
                  nm -g "$library" | grep -E ' [Tt] _TGExtraRefreshStoryVisibility$'
                  if nm -u "$library" | grep -F '$s14SwiftSignalKit10DisposableP7disposeyyFTj'; then
                    echo "Incompatible resilient Disposable dispatch thunk"
                    exit 1
                  fi
                done < <(find .theos/obj -type f -name TGExtra.dylib)

            - name: Upload DEB
              uses: actions/upload-artifact@v7
              with:
                name: ${{ matrix.scheme }}-package
                path: packages/*.deb

    release:
        if: github.event_name == 'release' && github.event.release.target_commitish == github.event.repository.default_branch
        needs: build
        runs-on: macos-15
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v7
              with:
                ref: ${{ github.event.release.target_commitish }}

            - name: Clean up existing rolling release
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                gh release delete release --yes || true
                git push origin :refs/tags/release || true

            - name: Download all DEBs
              uses: actions/download-artifact@v8
              with:
                path: packages
                merge-multiple: true

            - name: Generate Checksums
              id: metadata
              shell: bash
              run: |
                for pkg in packages/*_iphoneos-arm.deb; do
                  if [ -f "$pkg" ]; then
                    echo "### Rootful (iphoneos-arm)" >> release_body.md
                    echo "* MD5: $(md5 -q $pkg)" >> release_body.md
                    echo "* SHA1: $(shasum -a 1 $pkg | awk '{ print $1 }')" >> release_body.md
                    echo "* SHA256: $(shasum -a 256 $pkg | awk '{ print $1 }')" >> release_body.md
                    echo "" >> release_body.md
                    break
                  fi
                done

                for pkg in packages/*_iphoneos-arm64.deb; do
                  if [ -f "$pkg" ]; then
                    echo "### Rootless (iphoneos-arm64)" >> release_body.md
                    echo "* MD5: $(md5 -q $pkg)" >> release_body.md
                    echo "* SHA1: $(shasum -a 1 $pkg | awk '{ print $1 }')" >> release_body.md
                    echo "* SHA256: $(shasum -a 256 $pkg | awk '{ print $1 }')" >> release_body.md
                    echo "" >> release_body.md
                    break
                  fi
                done

                for pkg in packages/*_iphoneos-arm64e.deb; do
                  if [ -f "$pkg" ]; then
                    echo "### RootHide (iphoneos-arm64e)" >> release_body.md
                    echo "* MD5: $(md5 -q $pkg)" >> release_body.md
                    echo "* SHA1: $(shasum -a 1 $pkg | awk '{ print $1 }')" >> release_body.md
                    echo "* SHA256: $(shasum -a 256 $pkg | awk '{ print $1 }')" >> release_body.md
                    echo "" >> release_body.md
                    break
                  fi
                done

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v3
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                tag_name: release
                name: TGExtra FE
                body_path: release_body.md
                files: packages/*.deb
                draft: false
                prerelease: false
                make_latest: true

            - name: Delete build artifacts
              uses: geekyeggo/delete-artifact@v6
              with:
                name: |
                  rootful-package
                  rootless-package
                  roothide-package
                failOnError: false
